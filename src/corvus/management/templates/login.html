<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Corvus Hypervisor Operator Console</title>
  <link rel="icon" href="{{ static_url }}/brand/logo.png" type="image/png">
  <link rel="stylesheet" href="{{ static_url }}/corvus.css">
</head>
<body class="login-body">
  <div class="lab-atmosphere" aria-hidden="true"></div>
  <div class="login-wrap">
    <div class="card login-card">
      <div class="brand">
        <div class="logo">
          <img class="brand-mark" src="{{ static_url }}/brand/logo.png" width="28" height="28" alt="">
          Corvus
        </div>
        <div class="sub">Operator Console · Black Rain Labs</div>
      </div>
      {% if err %}
      <div class="badge danger form-error" id="login-error" role="alert">{{ err }}</div>
      {% endif %}
      <form method="post" action="{{ prefix }}/login">
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" autofocus autocomplete="username" required
                 {% if err %}aria-invalid="true" aria-describedby="login-error"{% endif %}>
          <div class="help">A Corvus user with the <span class="mono">admin</span> or <span class="mono">operator</span> role.</div>
        </div>
        <div class="field">
          <label for="password">Password or PIN</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
          <div class="help">Checked against the hashed credential stored for that user.</div>
        </div>
        <button class="btn primary" type="submit">Sign in</button>
      </form>
    </div>
  </div>
</body>
</html>
