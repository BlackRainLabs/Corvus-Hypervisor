<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Corvus Hypervisor Operator Console</title>
  <link rel="stylesheet" href="{{ static_url }}/corvus.css">
</head>
<body>
  <div class="login-wrap">
    <div class="card login-card">
      <div class="brand">
        <div class="logo"><span class="mark">C</span> Corvus Hypervisor</div>
        <div class="sub">Operator Console</div>
      </div>
      {% if err %}<div class="badge danger" style="display:block;text-align:center;margin:8px 0 4px;padding:8px;">{{ err }}</div>{% endif %}
      <form method="post" action="{{ prefix }}/login">
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" autofocus autocomplete="username" required>
          <div class="help">A Corvus user with the <span class="mono">admin</span> or <span class="mono">operator</span> role.</div>
        </div>
        <div class="field">
          <label for="password">Password or PIN</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
          <div class="help">Checked against the hashed credential stored for that user.</div>
        </div>
        <button class="btn primary" type="submit" style="width:100%;justify-content:center;">Sign in</button>
      </form>
    </div>
  </div>
</body>
</html>
